franka_lock_unlock:
  hostnames:
    type: string_array
    default_value: ["localhost"]
    read_only: true
    description: "Hostnames or IP addresses of the Franka Desk of each robot. All robots share the other parameters and the lifecycle state."
    validation:
      not_empty<>: []
      unique<>: []
  username:
    type: string
    default_value: "admin"
    description: "Username for the franka server to connect."
    validation:
      not_empty: []
  password:
    type: string
    default_value: "secretpwd"
    description: "Password for the franka server to connect."
    validation:
      not_empty: []
  robot_type:
    type: string
    default_value: "fr3"
    description: "Robot type: e.g. Franka Research 3 (fr3), Franka Emika Panda (panda)."
    validation:
      one_of<>: [ ["fr3", "panda"] ]
  enable_relock:
    type: bool
    default_value: true
    description: "Relock the brakes on exit."
  wait_web_ui:
    type: bool
    default_value: true
    description: "Wait in case the robot web UI is currently in use."
  request_physical_access:
    type: bool
    default_value: true
    description: "Request control by confirming physical access to the robot in case the robot web UI is currently in use"
  physical_access_timeout:
    type: int
    default_value: 20
    description: "Time in seconds to wait for the control when another user has it: confirmation in Desk or, with 'request_physical_access', the button on the robot."
    validation:
      gt<>: [0]
  enable_fci:
    type: bool
    default_value: true
    description: "Activate the Franka Control Interface (FCI)."
